services:
  ecommerce-api:
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      AUTO_MIGRATE: "true"
      Logging__LogLevel__Default: "Debug"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      Logging__LogLevel__Microsoft.EntityFrameworkCore: "Information"
      Logging__LogLevel__ECommerce: "Debug"
    ports:
      - "8080:8080"
      - "5001:5001"  # Optional: HTTPS port for local development
    volumes:
      # Mount source code for development (hot reload)
      - ./src/ECommerce.API:/src/ECommerce.API:ro
      - ./src/ECommerce.Application:/src/ECommerce.Application:ro
      - ./src/ECommerce.Domain:/src/ECommerce.Domain:ro
      - ./src/ECommerce.Infrastructure:/src/ECommerce.Infrastructure:ro
    command: ["dotnet", "watch", "run", "--project", "/src/ECommerce.API/ECommerce.API.csproj"]

  sqlserver:
    environment:
      SA_PASSWORD: "Docker123#"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql